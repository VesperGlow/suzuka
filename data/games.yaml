# 首页/「书架」页的 Galgame 数据。每条对应一部作品，按此文件顺序展示。
#
# 字段说明（除 title 外都可省略）：
#   title       作品标题（默认 / 中文页显示）
#   title_en    英文页显示的标题，省略则回退到 title
#   status      playing(在玩) | cleared(通关) | route(单线通关) | backlog(想玩)
#               —— 决定状态标签与配色
#   rating      个人评分（任意文本，如 9 或 9.5），省略则不显示
#   vndb        VNDB 条目 id（如 v27448，不是完整网址）。仅在没有 post 时用作卡片跳转目标。
#               id 可在对应作品的 VNDB 页面右上角看到（形如 v19073）。
#   post        关联文章的 slug（见各文 frontmatter 的 slug:）。填了就：
#               ① 卡片优先跳到对应语言的文章；② 没填 cover 时借用文章首图作封面
#   anchor      正文小节锚点 id（需 post）。填了卡片就跳到文章内对应小节，如 #bls-jisheng。
#               锚点用 Markdown 标题后的 {#id} 显式指定，中英文用同一 id。
#   cover       封面图：外链 http(s)（构建时会自动下载并自托管）或站内路径。
#               这里用的是 VNDB 官方封面 URL —— 取法：用 VNDB API 按 id 查 image.url 字段，例如
#               curl -H "Content-Type: application/json" \
#                    -d '{"filters":["id","=","v27448"],"fields":"image.url"}' \
#                    https://api.vndb.org/kana/vn
#               （本站 Hugo 的 GetRemote 能下载图片但无法解析 JSON 响应，故封面 URL 预置于此而非构建时实时查询。）
#
# 封面优先级：cover > 文章首图(需 post) > 占位图


# 此文件在 Nginx 的 http 上下文内加载。
map $uri $site_cache_control {
    default "no-cache";
    ~^/(css|js)/.+\.min\.[0-9a-f]+\.(css|js)$ "public, max-age=31536000, immutable";
    ~^/pagefind/(index/|fragment/|.*\.pagefind$) "public, max-age=31536000, immutable";
}

server {
    listen 8787;
    listen [::]:8787;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header Cache-Control $site_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /en/ {
        error_page 404 /en/404.html;
        try_files $uri $uri/ =404;
    }
}

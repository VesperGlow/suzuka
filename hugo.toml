baseURL = 'https://suzuka-chan.moe/'
defaultContentLanguage = 'zh-cn'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
summaryLength = 90

[pagination]
  pagerSize = 6

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[permalinks]
  posts = '/posts/:slugorcontentbasename/'

[taxonomies]
  tag = 'tags'
  category = 'categories'

[params]
  assetVersion = '24'
  author = 'Suzuka'
  images = ['favicon/favicon-orb.webp']

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[languages]
  [languages.zh-cn]
    locale = 'zh-CN'
    label = '中文'
    title = '小凉花厨的网站'
    weight = 1
    hasCJKLanguage = true
    [languages.zh-cn.params]
      description = 'Galgame 感想、偶尔浮现的思考，以及落下的生活碎片。'
    [[languages.zh-cn.menus.main]]
      identifier = 'home'
      name = '首页'
      pageRef = '/'
      weight = 10
    [[languages.zh-cn.menus.main]]
      identifier = 'posts'
      name = '文章'
      pageRef = '/posts'
      weight = 20
    [[languages.zh-cn.menus.main]]
      identifier = 'search'
      name = '搜索'
      pageRef = '/pages/search'
      weight = 60
    [[languages.zh-cn.menus.main]]
      identifier = 'about'
      name = '凉花'
      pageRef = '/pages/about'
      weight = 70

  [languages.en]
    locale = 'en'
    label = 'English'
    title = "Suzuka's Garden"
    weight = 2
    [languages.en.params]
      description = 'Thoughts on visual novels, passing reflections, and fragments of everyday life.'
    [[languages.en.menus.main]]
      identifier = 'home'
      name = 'Home'
      pageRef = '/'
      weight = 10
    [[languages.en.menus.main]]
      identifier = 'posts'
      name = 'Posts'
      pageRef = '/posts'
      weight = 20
    [[languages.en.menus.main]]
      identifier = 'search'
      name = 'Search'
      pageRef = '/pages/search'
      weight = 60
    [[languages.en.menus.main]]
      identifier = 'about'
      name = 'Suzuka'
      pageRef = '/pages/about'
      weight = 70

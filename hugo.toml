baseURL = 'https://suzuka-chan.moe/'
locale = 'zh-CN'
title = '小凉花厨的网站'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
enableRobotsTXT = true
disableKinds = ['taxonomy']
summaryLength = 90

[pagination]
  pagerSize = 6

[permalinks]
  posts = '/posts/:year/:month/:slug/'

[taxonomies]
  tag = 'tags'
  category = 'categories'

[params]
  assetVersion = '5'
  description = 'Galgame 感想、偶尔浮现的思考，以及落下的生活碎片。'
  author = 'Suzuka'
  images = ['favicon/favicon-orb.webp']

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[menu]
  [[menu.main]]
    name = '首页'
    pageRef = '/'
    weight = 10
  [[menu.main]]
    name = '文章'
    pageRef = '/posts'
    weight = 20
  [[menu.main]]
    name = '搜索'
    pageRef = '/pages/search'
    weight = 60
  [[menu.main]]
    name = '凉花'
    pageRef = '/pages/about'
    weight = 70

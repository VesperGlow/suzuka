{{ define "main" }}
  <header class="page-header">
    <p class="eyebrow">Collection</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </header>

  <section class="collection-section" aria-labelledby="latest-posts-heading">
    <div class="section-heading">
      <div>
        <p class="eyebrow">Latest posts</p>
        <h2 id="latest-posts-heading">最近的文章</h2>
      </div>
    </div>
    {{ partial "category-filter.html" . }}
    <div class="post-list">
      {{ range first 5 .RegularPages.ByDate.Reverse }}
        {{ partial "post-card.html" . }}
      {{ else }}
        <p class="empty">这里暂时还是空的。</p>
      {{ end }}
    </div>
    <div class="collection-footer">
      <a class="text-link" href="{{ relURL "archives/" }}">查看全部文章 <span aria-hidden="true">→</span></a>
    </div>
  </section>
{{ end }}

<dialog class="article-lightbox" data-article-lightbox aria-label="图片预览">
  <div class="article-lightbox-viewer" data-article-lightbox-viewer>
    <img data-article-lightbox-image alt="" draggable="false">
  </div>
  <div class="article-lightbox-controls" role="group" aria-label="图片缩放控制">
    <button type="button" data-article-lightbox-zoom-out aria-label="缩小图片">−</button>
    <button type="button" data-article-lightbox-reset aria-label="重置图片缩放">1:1</button>
    <button type="button" data-article-lightbox-zoom-in aria-label="放大图片">+</button>
    <button type="button" data-article-lightbox-close aria-label="关闭图片预览">×</button>
  </div>
</dialog>

<dialog class="article-lightbox" data-article-lightbox aria-label="{{ i18n "imagePreview" }}" data-reset-zoom="{{ i18n "resetZoom" }}" data-reset-zoom-at="{{ i18n "resetZoomAt" (dict "Scale" "{scale}") }}">
  <div class="article-lightbox-viewer" data-article-lightbox-viewer>
    <img data-article-lightbox-image alt="" draggable="false">
    <button class="article-lightbox-nav article-lightbox-prev" type="button" data-article-lightbox-prev aria-label="{{ i18n "previousImage" }}" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></svg>
    </button>
    <button class="article-lightbox-nav article-lightbox-next" type="button" data-article-lightbox-next aria-label="{{ i18n "nextImage" }}" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></svg>
    </button>
  </div>
  <div class="article-lightbox-count" data-article-lightbox-count aria-live="polite" hidden></div>
  <button class="article-lightbox-close" type="button" data-article-lightbox-close aria-label="{{ i18n "closeImagePreview" }}">
    <span aria-hidden="true">×</span>
  </button>
  <div class="article-lightbox-controls" role="group" aria-label="{{ i18n "imagePreviewControls" }}">
    <button class="article-lightbox-control-nav" type="button" data-article-lightbox-mobile-prev aria-label="{{ i18n "previousImage" }}" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></svg>
    </button>
    <button type="button" data-article-lightbox-zoom-out aria-label="{{ i18n "zoomOut" }}">−</button>
    <button type="button" data-article-lightbox-reset aria-label="{{ i18n "resetZoom" }}">1:1</button>
    <button type="button" data-article-lightbox-zoom-in aria-label="{{ i18n "zoomIn" }}">+</button>
    <button class="article-lightbox-control-nav" type="button" data-article-lightbox-mobile-next aria-label="{{ i18n "nextImage" }}" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></svg>
    </button>
  </div>
</dialog>

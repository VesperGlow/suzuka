{{- $previous := .PrevInSection -}}
{{- $next := .NextInSection -}}
{{- if or $previous $next }}
  <nav class="post-navigation" aria-label="相邻文章">
    {{ with $previous }}
      <a class="post-navigation-previous" href="{{ .RelPermalink }}"><span>← 上一篇</span><strong>{{ .Title }}</strong></a>
    {{ else }}<span aria-hidden="true"></span>{{ end }}
    {{ with $next }}
      <a class="post-navigation-next" href="{{ .RelPermalink }}"><span>下一篇 →</span><strong>{{ .Title }}</strong></a>
    {{ else }}<span aria-hidden="true"></span>{{ end }}
  </nav>
{{- end }}

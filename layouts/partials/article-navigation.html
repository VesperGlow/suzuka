{{- $previous := .PrevInSection -}}
{{- $next := .NextInSection -}}
{{- if or $previous $next }}
  <nav class="post-navigation" aria-label="{{ i18n "adjacentPosts" }}">
    {{ with $previous }}
      <a class="post-navigation-previous" href="{{ .RelPermalink }}"><span>{{ i18n "previousPost" }}</span><strong>{{ .Title }}</strong></a>
    {{ else }}<span aria-hidden="true"></span>{{ end }}
    {{ with $next }}
      <a class="post-navigation-next" href="{{ .RelPermalink }}"><span>{{ i18n "nextPost" }}</span><strong>{{ .Title }}</strong></a>
    {{ else }}<span aria-hidden="true"></span>{{ end }}
  </nav>
{{- end }}

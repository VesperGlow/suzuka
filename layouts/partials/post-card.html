<article class="post-card">
  <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">
    <strong>{{ .Date.Format "01.02" }}</strong>
    <span>{{ .Date.Format "2006" }}</span>
  </time>
  <div class="post-card-body">
    <div class="post-card-meta">
      <span>共 {{ .WordCount }} 字</span>
      <span>配图 {{ strings.Count "<img" .Content }} 张</span>
    </div>
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <div class="post-card-summary">
      <p>{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify }}{{ end }}</p>
      <a class="read-more" href="{{ .RelPermalink }}" aria-label="阅读《{{ .Title }}》">开始阅读 <span aria-hidden="true">→</span></a>
    </div>
  </div>
</article>

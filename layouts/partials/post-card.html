<article class="post-card">
  <div class="post-date" aria-label="发布日期">
    <strong>{{ .Date.Format "02" }}</strong>
    <span>{{ .Date.Format "2006.01" }}</span>
  </div>
  <div class="post-card-body">
    <div class="post-card-meta">
      {{ with index (.GetTerms "categories") 0 }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}
      <span>约 {{ .ReadingTime }} 分钟阅读</span>
    </div>
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <p>{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify }}{{ end }}</p>
    <a class="read-more" href="{{ .RelPermalink }}" aria-label="阅读《{{ .Title }}》">继续阅读 <span aria-hidden="true">→</span></a>
  </div>
</article>

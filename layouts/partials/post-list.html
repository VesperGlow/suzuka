<section class="collection-section{{ with .class }} {{ . }}{{ end }}" aria-labelledby="{{ .headingID }}" data-post-filter-scope>
  <div class="section-heading">
    <div>
      <p class="eyebrow">{{ .eyebrow }}</p>
      <h2 id="{{ .headingID }}">{{ .heading }}</h2>
    </div>
  </div>
  {{ if .showFilters }}
    {{ partial "post-filter.html" .context }}
  {{ end }}
  {{ partial "post-card-list.html" (dict "pages" .pages) }}
  <p class="empty filter-empty" data-filter-empty aria-live="polite" hidden>这里暂时还没有文字。</p>
  {{ with .footerURL }}
    <div class="collection-footer">
      <a class="text-link" href="{{ . }}">{{ $.footerLabel }} <span aria-hidden="true">→</span></a>
    </div>
  {{ end }}
</section>

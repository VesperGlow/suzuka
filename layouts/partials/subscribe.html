{{- $rss := site.Home.OutputFormats.Get "RSS" -}}
{{- $jsonFeed := site.Home.OutputFormats.Get "JSONFeed" -}}
<aside class="post-subscribe">
  <span class="post-subscribe-copy">
    <strong>{{ i18n "subscribeTitle" }}</strong>
    <span>{{ i18n "subscribeDescription" }}</span>
  </span>
  <span class="post-subscribe-links">
    {{ with $rss }}
      <a class="subscribe-link" href="{{ .RelPermalink }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.5" fill="currentColor" stroke="none"/></svg>
        {{ i18n "subscribeRSS" }}
      </a>
    {{ end }}
    {{ with $jsonFeed }}
      <a class="subscribe-link" href="{{ .RelPermalink }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H6a2 2 0 0 0-2 2v3a2 2 0 0 1-2 2 2 2 0 0 1 2 2v3a2 2 0 0 0 2 2h2M16 4h2a2 2 0 0 1 2 2v3a2 2 0 0 0 2 2 2 2 0 0 0-2 2v3a2 2 0 0 1-2 2h-2"/></svg>
        {{ i18n "subscribeJSONFeed" }}
      </a>
    {{ end }}
  </span>
</aside>

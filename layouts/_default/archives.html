{{ define "main" }}
  <header class="page-header">
    <p class="eyebrow">All posts</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p>{{ . }}</p>{{ end }}
  </header>
  <div class="archive">
    {{ range (where site.RegularPages "Section" "posts").GroupByDate "2006" }}
      <section class="archive-year">
        <h2>{{ .Key }}</h2>
        <div>
          {{ range .Pages }}
            <a class="archive-item" href="{{ .RelPermalink }}">
              <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01.02" }}</time>
              <span class="archive-title">{{ .Title }}</span>
            </a>
          {{ end }}
        </div>
      </section>
    {{ else }}
      <p class="empty">还没有可以归档的文章。</p>
    {{ end }}
  </div>
{{ end }}

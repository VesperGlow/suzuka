{{ define "main" }}
  <article class="about-page">
    <div class="about-copy">
      <header class="about-header">
        <p class="eyebrow">{{ i18n "aboutEyebrow" }}</p>
        <h1>{{ .Title }}</h1>
      </header>

      <div class="prose about-prose">{{ .Content }}</div>
      {{ partial "about-stats.html" . }}
      {{ partial "subscribe.html" . }}
      <div class="about-residency-row">
        {{ partial "about-uptime.html" . }}
      </div>
    </div>

    <picture class="about-visual">
      <source media="(max-width: 768px)" srcset="{{ "characters/suzuka_sp.webp" | relURL }}">
      <img src="{{ "characters/suzuka_pc.webp" | relURL }}" alt="{{ i18n "aboutImageAlt" }}" width="1264" height="2034">
    </picture>
  </article>
  <script type="module" src="{{ partial "asset-url.html" "js/about-uptime.js" }}"></script>
  <script src="{{ partial "asset-url.html" "js/about-stats.js" }}" defer></script>
{{ end }}

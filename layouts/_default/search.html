{{ define "main" }}
  <pagefind-config preload></pagefind-config>
  {{ partial "page-hero.html" (dict "page" . "eyebrow" "Search" "description" "在文章标题、正文和标签中查找。" "class" "search-header") }}

  <section class="search" aria-labelledby="search-label" data-search-page>
    <form class="search-form" role="search" action="{{ .RelPermalink }}" method="get" data-search-form>
      <label id="search-label" class="sr-only" for="search-input">搜索文章</label>
      <input id="search-input" name="q" type="search" placeholder="输入关键词……" autocomplete="off" data-search-input>
      <button class="search-clear" type="button" data-search-clear hidden>清空</button>
      <button class="search-submit" type="submit">搜索</button>
    </form>
    <p class="search-status" aria-live="polite" data-search-status>输入关键词开始搜索。</p>
    <div class="search-results" data-search-results></div>
  </section>
  <script type="module" src="{{ partial "asset-url.html" "js/search-page.js" }}"></script>
{{ end }}

{{ define "main" }}
  <header class="page-header search-header">
    <p class="eyebrow">Search</p>
    <h1>{{ .Title }}</h1>
    <p>在文章标题、正文和标签中查找。</p>
  </header>

  <section class="search" aria-labelledby="search-label">
    <form class="search-form" role="search" action="{{ .RelPermalink }}" method="get">
      <label id="search-label" class="sr-only" for="search-input">搜索文章</label>
      <input id="search-input" name="q" type="search" placeholder="输入关键词……" autocomplete="off" autofocus>
      <button id="search-clear" class="search-clear" type="button" hidden>清空</button>
      <button class="search-submit" type="submit">搜索</button>
    </form>
    <p id="search-status" class="search-status" aria-live="polite">输入关键词开始搜索。</p>
    <div id="search-results" class="search-results"></div>
  </section>

  <script type="module" src="{{ "js/search.js" | relURL }}"></script>
{{ end }}

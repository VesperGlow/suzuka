{{ define "main" }}
  {{ partial "page-hero.html" (dict "page" . "eyebrow" (i18n "indexEyebrow") "description" (i18n "termsDescription")) }}
  <div class="term-cloud">
    {{ range .Data.Terms.ByCount }}
      <a href="{{ .Page.RelPermalink }}"><span>{{ .Page.LinkTitle }}</span><small>{{ .Count }}</small></a>
    {{ else }}
      <p class="empty">{{ i18n "empty" }}</p>
    {{ end }}
  </div>
{{ end }}

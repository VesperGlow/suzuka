{{ define "main" }}
  <section class="guestbook-page">
    {{ partial "page-hero.html" (dict
      "page" .
      "eyebrow" "Guestbook"
      "description" .Description
      "class" "guestbook-header"
    ) }}

    {{- $postsIndex := site.Home.OutputFormats.Get "GuestbookPosts" -}}
    <div class="guestbook-app" data-guestbook-app data-api-url="/api/guestbook/messages" data-posts-url="{{ $postsIndex.RelPermalink }}">
      <div class="guestbook-layout">
      <form class="guestbook-form guestbook-compose" data-guestbook-form>
        <div class="guestbook-reference-tools">
          <aside class="guestbook-reference" data-guestbook-reference hidden>
            <span>正在评论：</span><a data-guestbook-reference-link></a>
            <button type="button" data-guestbook-reference-clear aria-label="取消评论文章">取消</button>
          </aside>
          <button class="guestbook-post-picker-toggle" type="button" data-guestbook-post-picker-toggle aria-expanded="false" aria-controls="guestbook-post-picker">选择一篇文章聊聊</button>
        </div>

        <section class="guestbook-post-picker" id="guestbook-post-picker" data-guestbook-post-picker hidden aria-label="选择要评论的文章">
          <label for="guestbook-post-search">搜索文章标题</label>
          <input id="guestbook-post-search" type="search" data-guestbook-post-search placeholder="输入关键词，或从最近文章中选择" autocomplete="off">
          <p class="guestbook-post-picker-status" data-guestbook-post-picker-status role="status" aria-live="polite"></p>
          <ul class="guestbook-post-results" data-guestbook-post-results></ul>
        </section>

        <div class="guestbook-field guestbook-name-field">
          <label for="guestbook-name">名字</label>
          <input id="guestbook-name" name="name" type="text" maxlength="40" autocomplete="name" required>
        </div>

        <details class="guestbook-optional-fields">
          <summary>邮箱与网址（可选）</summary>
          <div class="guestbook-optional-fields-inner">
            <div class="guestbook-field">
              <label for="guestbook-email">邮箱</label>
              <input id="guestbook-email" name="email" type="email" maxlength="120" autocomplete="email">
            </div>
            <div class="guestbook-field">
              <label for="guestbook-website">网址</label>
              <input id="guestbook-website" name="website" type="url" maxlength="200" autocomplete="url" placeholder="https://">
            </div>
          </div>
        </details>

        <div class="guestbook-field guestbook-content-field">
          <label for="guestbook-content">留言</label>
          <textarea id="guestbook-content" name="content" maxlength="2000" rows="6" placeholder="写下一点痕迹…" required></textarea>
        </div>

        <div class="guestbook-form-footer">
          <p class="guestbook-form-status" data-guestbook-form-status role="status" aria-live="polite"></p>
          <button class="guestbook-submit" type="submit">留下留言</button>
        </div>
      </form>

      <section class="guestbook-messages guestbook-thread" aria-labelledby="guestbook-messages-title">
        <header class="guestbook-messages-header">
          <h2 id="guestbook-messages-title">留言</h2>
          <span data-guestbook-count aria-live="polite"></span>
        </header>
        <p class="guestbook-list-status" data-guestbook-list-status role="status">正在读取留言…</p>
        <ol class="guestbook-message-list" data-guestbook-message-list></ol>
      </section>
      </div>

      <noscript><p class="guestbook-list-status">请启用 JavaScript 后查看和提交留言。</p></noscript>
    </div>
  </section>

  <script type="module" src="{{ partial "asset-url.html" "js/guestbook.js" }}"></script>
{{ end }}

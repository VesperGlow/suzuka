# 按需解析构建器依赖并格式化，存在变更时提交修复并重新触发站点构建。
name: Update lockfiles & rustfmt

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 连推两次时串行执行，避免两个 run 同时 push 修复提交互相打架。
concurrency:
  group: update-lockfile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt

      - name: Resolve dependencies (ssg)
        working-directory: ssg
        run: cargo metadata --format-version 1 > /dev/null

      - name: Format (ssg)
        working-directory: ssg
        run: cargo fmt

      - name: Commit fixes if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u ssg
          if git diff --cached --quiet; then
            echo "lockfiles and formatting already up to date"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: CI 机械修复（lockfile 解析 / rustfmt）"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site-image build
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site-image.yml --ref "${{ github.ref_name }}"

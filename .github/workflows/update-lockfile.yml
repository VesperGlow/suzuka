# 本地开发机没有 Rust 工具链（构建全靠容器/CI），两类"机械修复"没法在本地做：
#   1. 改 Cargo.toml 加依赖后更新 Cargo.lock（用 `cargo metadata` 做最小化解析，
#      只补齐变更涉及的条目，不像 `cargo update` 那样顺手升级所有既有依赖）；
#   2. rustfmt 格式化（fmt 是 CI 阻断项，本地写的代码格式没法预检）。
# 手动触发本 workflow，让 CI 在所选分支上跑这两步并把结果提交回来；有提交时
# 自动用 API 触发一次 site-image 构建（GITHUB_TOKEN 的 push 不会自动触发其他
# workflow，但显式的 workflow_dispatch API 调用可以）。
name: Update lockfiles & rustfmt

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt

      - name: Resolve dependencies (backend)
        working-directory: backend
        run: cargo metadata --format-version 1 > /dev/null

      - name: Resolve dependencies (ssg)
        working-directory: ssg
        run: cargo metadata --format-version 1 > /dev/null

      - name: Format (backend)
        working-directory: backend
        run: cargo fmt

      - name: Format (ssg)
        working-directory: ssg
        run: cargo fmt

      - name: Commit fixes if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u backend ssg
          if git diff --cached --quiet; then
            echo "lockfiles and formatting already up to date"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: CI 机械修复（lockfile 解析 / rustfmt）"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site-image build
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site-image.yml --ref "${{ github.ref_name }}"

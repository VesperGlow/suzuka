name: Build site image

# 站点内容或后端任意变更都重建合并镜像（前端 + 后端打进一个容器）；也可手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 先跑单元 + 集成测试；bundled SQLite 由 cc 随构建编译，Ubuntu 自带 gcc 即可。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Test
        working-directory: backend
        run: cargo test --locked

  # ssg（自研静态站点生成器）编译检查：只是 cargo build，没有测试用例，
  # 名字照实说是「编译检查」而不是「test」。产物直接进 Containerfile 镜像
  # 构建，编译失败应阻断镜像发布，因此和 backend test 一样是 build-push
  # 的前置依赖。
  ssg-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ssg

      - name: Build
        working-directory: ssg
        run: cargo build --release --locked

  # rustfmt 纯机械格式检查、backend 和 ssg 都已清干净，两边一起提升为阻断项。
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format (backend)
        working-directory: backend
        run: cargo fmt --check

      - name: Format (ssg)
        working-directory: ssg
        run: cargo fmt --check

  # clippy 作为旁路反馈：失败不阻断镜像发布（build-push 不 needs 这个 job）。
  # 随工具链版本可能新增误报性较强的 pedantic 分支，暂不提升为阻断项。
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Clippy (ssg)
        working-directory: ssg
        run: cargo clippy --all-targets --locked -- -D warnings

  build-push:
    needs: [test, ssg-build, fmt]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名取仓库全名（metadata-action 会自动转小写）：ghcr.io/<owner>/suzuka。
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

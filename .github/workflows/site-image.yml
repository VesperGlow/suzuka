name: Build site image

# 站点内容或后端任意变更都重建合并镜像（前端 + 后端打进一个容器）；也可手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 快速连推两次 main 时，两个 run 的 build-push 会并行，旧 commit 的镜像可能
# 后完成并反超新 commit 成为 latest。同组内取消进行中的旧 run，保证 latest
# 恒为最新提交。
concurrency:
  group: site-image
  cancel-in-progress: true

jobs:
  # 先跑单元 + 集成测试；bundled SQLite 由 cc 随构建编译，Ubuntu 自带 gcc 即可。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Test
        working-directory: backend
        run: cargo test --locked

  # ssg（自研静态站点生成器）编译 + 全站构建冒烟：内容或模板出错时在这里
  # 就阻断，而不是等到 build-push 的镜像构建才失败（信号更早、日志更直读）。
  # 产物直接进 Containerfile 镜像构建，因此和 backend test 一样是 build-push
  # 的前置依赖。
  ssg-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ssg

      - name: Build
        working-directory: ssg
        run: cargo build --release --locked

      - name: Build site (smoke)
        run: ./ssg/target/release/ssg build --source . --dest /tmp/site-out --minify

  # rustfmt 纯机械格式检查、backend 和 ssg 都已清干净，两边一起提升为阻断项。
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt

      - name: Format (backend)
        working-directory: backend
        run: cargo fmt --check

      - name: Format (ssg)
        working-directory: ssg
        run: cargo fmt --check

  # clippy：backend 和 ssg 都已清干净，跟 fmt 一样两边一起提升为阻断项。
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            ssg

      - name: Clippy (backend)
        working-directory: backend
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Clippy (ssg)
        working-directory: ssg
        run: cargo clippy --all-targets --locked -- -D warnings

  build-push:
    needs: [test, ssg-build, fmt, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名取仓库全名（metadata-action 会自动转小写）：ghcr.io/<owner>/suzuka。
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

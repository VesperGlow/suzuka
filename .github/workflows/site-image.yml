name: Build site image

# 站点内容或后端任意变更都重建合并镜像（前端 + 后端打进一个容器）；也可手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 先跑单元 + 集成测试；bundled SQLite 由 cc 随构建编译，Ubuntu 自带 gcc 即可。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Test
        working-directory: backend
        run: cargo test --locked

  # 静态检查作为旁路反馈：失败不阻断镜像发布（build-push 只 needs: test）。
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Format
        working-directory: backend
        run: cargo fmt --check

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名取仓库全名（metadata-action 会自动转小写）：ghcr.io/<owner>/suzuka。
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

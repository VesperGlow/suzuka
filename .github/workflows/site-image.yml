name: Build static site and image

# 构建并检查纯静态产物，同时提供可选的 Nginx 静态站镜像。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 快速连推两次 main 时，两个 run 的 build-push 会并行，旧 commit 的镜像可能
# 后完成并反超新 commit 成为 latest。同组内取消进行中的旧 run，保证 latest
# 恒为最新提交。
concurrency:
  group: site-image
  cancel-in-progress: true

jobs:
  ssg-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check source references
        run: python3 scripts/check-source.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ssg

      - name: Test generator
        working-directory: ssg
        run: cargo test --locked

      - name: Build
        working-directory: ssg
        run: cargo build --release --locked

      - name: Build site (smoke)
        run: ./ssg/target/release/ssg build --source . --dest /tmp/site-out --minify

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build search index
        run: npx -y pagefind@1.3.0 --site /tmp/site-out

      - name: Check static output
        run: python3 scripts/check-static.py /tmp/site-out

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: /tmp/site-out
          include-hidden-files: true

      # 死链检查（--offline 只查站内）：双语站互链多，改 slug / 挪文章时烂掉的
      # 内链靠人眼很难发现。外链不查——外网抖动不应阻断构建；带锚点的站内
      # 链接如需连 #fragment 一起校验，可以再加 --include-fragments。
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir /tmp/site-out --no-progress "/tmp/site-out/**/*.html"
          fail: true

  # 构建器的格式和 lint 检查。
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt

      - name: Format (ssg)
        working-directory: ssg
        run: cargo fmt --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ssg

      - name: Clippy (ssg)
        working-directory: ssg
        run: cargo clippy --all-targets --locked -- -D warnings

  build-push:
    needs: [ssg-build, fmt, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名取仓库全名（metadata-action 会自动转小写）：ghcr.io/<owner>/<repository>。
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

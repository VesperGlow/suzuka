name: SSG parity check

# 定制 Rust 生成器（ssg/）与 Hugo 产物的对拍。site-image 流水线已切换为用
# ssg 构建生产产物；这个 workflow 现在是切换后的回归防线，手动触发，
# 不随 push 跑、也不阻断 site-image 流水线。
on:
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本与 Containerfile 的 HUGO_VERSION 保持一致。
      - name: Install Hugo extended
        env:
          HUGO_VERSION: 0.163.3
        run: |
          curl -fsSL -o /tmp/hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo apt-get install -y /tmp/hugo.deb

      # 黄金基准用「不带 --minify」的 Hugo，ssg 这边也不加 --minify：两边都不
      # 压缩才能逐行对拍出内容/结构级别的差异——minify 之后不同 minifier 的
      # 压缩选择本来就不会逐字节一致，对拍没有意义（minify 正确性另外验证，
      # 见 ssg/README.md）。
      - name: Build golden (Hugo, no minify)
        run: hugo --destination golden

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ssg

      - name: Build ssg
        working-directory: ssg
        run: cargo build --release

      - name: Generate ssg output
        run: ./ssg/target/release/ssg build --source . --dest public-ssg

      - name: Diff against golden
        run: ./ssg/target/release/ssg diff golden public-ssg

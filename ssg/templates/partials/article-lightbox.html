<dialog class="article-lightbox" data-article-lightbox aria-label="{{ t("imagePreview") }}" data-reset-zoom="{{ t("resetZoom") }}" data-reset-zoom-at="{{ t("resetZoomAt", Scale="{scale}") }}">
  <div class="article-lightbox-viewer" data-article-lightbox-viewer>
    <img data-article-lightbox-image alt="" draggable="false">
    <button class="article-lightbox-nav article-lightbox-prev" type="button" data-article-lightbox-prev aria-label="{{ t("previousImage") }}" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></svg>
    </button>
    <button class="article-lightbox-nav article-lightbox-next" type="button" data-article-lightbox-next aria-label="{{ t("nextImage") }}" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></svg>
    </button>
  </div>
  <div class="article-lightbox-count" data-article-lightbox-count aria-live="polite" hidden></div>
  <button class="article-lightbox-close" type="button" data-article-lightbox-close aria-label="{{ t("closeImagePreview") }}">
    <span aria-hidden="true">×</span>
  </button>
  <div class="article-lightbox-controls" role="group" aria-label="{{ t("imagePreviewControls") }}">
    <button class="article-lightbox-control-nav" type="button" data-article-lightbox-mobile-prev aria-label="{{ t("previousImage") }}" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></svg>
    </button>
    <button type="button" data-article-lightbox-zoom-out aria-label="{{ t("zoomOut") }}">−</button>
    <button type="button" data-article-lightbox-reset aria-label="{{ t("resetZoom") }}">1:1</button>
    <button type="button" data-article-lightbox-zoom-in aria-label="{{ t("zoomIn") }}">+</button>
    <button class="article-lightbox-control-nav" type="button" data-article-lightbox-mobile-next aria-label="{{ t("nextImage") }}" hidden>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></svg>
    </button>
  </div>
</dialog>

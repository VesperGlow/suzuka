<aside class="post-discussion">
  <a class="post-discussion-link" href="{{ site.guestbook_rel | safe }}?ref_title={{ page.title | urlquery | safe }}&amp;ref_url={{ page.counter_path | urlquery | safe }}" aria-labelledby="post-discussion-title post-discussion-description post-discussion-entry-label">
    <span class="post-discussion-copy">
      <strong id="post-discussion-title">{{ t("postDiscussionTitle") }}</strong>
      <span id="post-discussion-description">{{ t("postDiscussionDescription") }}</span>
    </span>
    <span class="post-discussion-action">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5.5 18.5 3 21v-5.2A8 8 0 0 1 4 4.5 11.5 11.5 0 0 1 12 2c5 0 9 3.1 9 7s-4 7-9 7a11.7 11.7 0 0 1-3.4-.5Z" />
        <path d="M8 9h8M8 12h5" />
      </svg>
      <span id="post-discussion-entry-label">{{ t("guestbookTitle") }}</span>
      <span class="post-discussion-arrow" aria-hidden="true">→</span>
    </span>
  </a>
</aside>

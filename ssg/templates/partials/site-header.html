{% set ns = namespace(url="", locale="") %}
{%- for tr in page.all_translations -%}
  {%- if tr.lang != site.lang -%}{% set ns.url = tr.rel %}{% set ns.locale = tr.locale %}{%- endif -%}
{%- endfor -%}
<header class="site-header">
  <div class="header-inner">
    <button class="header-action sidebar-toggle" type="button" data-sidebar-toggle aria-controls="sidebar-nav" aria-expanded="false" aria-label="{{ t("sidebarToggle") }}" title="{{ t("sidebarToggle") }}">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path class="nav-menu-bar nav-menu-bar-top" d="M4 7h16"></path>
        <path class="nav-menu-bar nav-menu-bar-mid" d="M4 12h16"></path>
        <path class="nav-menu-bar nav-menu-bar-bottom" d="M4 17h16"></path>
      </svg>
    </button>
    <a class="site-brand" href="{{ site.home_rel | safe }}" aria-label="{{ t("brandHomeLabel", Title=site.title) }}">
      <img class="brand-mark" src="/favicon/favicon-round.webp?v=2" alt="" width="30" height="30">
      <span class="brand-text">{{ site.title }}</span>
    </a>
    <div class="header-tools" data-header-tools>
      {% include "partials/header-search.html" -%}
<div class="header-actions">
        <button class="header-action theme-toggle" type="button" data-theme-toggle data-label-light="{{ t("themeToLight") }}" data-label-dark="{{ t("themeToDark") }}" aria-label="{{ t("themeToDark") }}" title="{{ t("themeToDark") }}">
          <svg class="theme-toggle-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M20 15.2A8.4 8.4 0 0 1 8.8 4 8.4 8.4 0 1 0 20 15.2Z"></path>
          </svg>
          <svg class="theme-toggle-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="12" cy="12" r="3.5"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
          </svg>
        </button>
        <button class="header-action nav-search-toggle" type="button" data-header-search-toggle aria-label="{{ t("searchLabel") }}" aria-controls="header-search" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="7.25"></circle>
            <path d="m15.8 15.8 5.2 5.2"></path>
          </svg>
        </button>
        <a class="header-action lang-toggle language-switcher {% if site.lang == "zh-cn" %}is-zh{% else %}is-en{% endif %}" href="{{ ns.url | safe }}" hreflang="{{ ns.locale }}" aria-label="{{ t("languageSwitcher") }}" data-language-toggle>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <g class="lang-toggle-char lang-toggle-zh">
              <path d="M7 8h10M12 5v3M9 10c1.2 3.8 4.3 6.8 8 8M15 10c-1.1 3.8-4.2 6.8-8 8"></path>
            </g>
            <g class="lang-toggle-char lang-toggle-en">
              <path d="M7.5 18 12 6l4.5 12M9 14h6"></path>
            </g>
          </svg>
        </a>
      </div>
    </div>
  </div>
</header>
<script src="{{ asset("js/language-toggle.js") | safe }}" defer></script>
<script src="{{ asset("js/nav-menu.js") | safe }}" defer></script>

<div
  id="header-search"
  class="header-search-wrap"
  data-header-search
  data-i18n-searching="{{ t("searching") }}"
  data-i18n-empty="{{ t("headerSearchEmpty") }}"
  data-i18n-unavailable="{{ t("headerSearchUnavailable") }}"
  data-i18n-count="{{ t("headerSearchCount", Count="{count}") }}"
  data-i18n-more="{{ t("headerSearchMore") }}"
>
  <form class="header-search" role="search" novalidate>
    <label class="sr-only" for="header-search-input">{{ t("searchArticles") }}</label>
    <input
      id="header-search-input"
      name="q"
      type="search"
      placeholder="{{ t("headerSearchPlaceholder") }}"
      autocomplete="off"
      aria-label="{{ t("searchArticles") }}"
      aria-controls="header-search-popover"
      aria-expanded="false"
    >
    <button class="header-search-clear" type="button" aria-label="{{ t("clearSearch") }}" hidden>{{ t("clear") }}</button>
    <button class="header-search-submit" type="submit">{{ t("search") }}</button>
  </form>

  <div id="header-search-popover" class="header-search-popover" hidden>
    <p class="header-search-status" aria-live="polite"></p>
    <div class="header-search-results" role="list" aria-label="{{ t("searchResults") }}"></div>
    <button class="header-search-more" type="button" hidden>{{ t("headerSearchMore") }}</button>
  </div>
</div>
<script type="module" src="{{ asset("js/header-search.js") | safe }}"></script>

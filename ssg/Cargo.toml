[package]
name = "ssg"
version = "0.1.0"
edition = "2021"
description = "文字庭院 · 静态博客构建器"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
fast_image_resize = "5"
imagesize = "0.13"
lightningcss = { version = "1.0.0-alpha.71", default-features = false }
minify-html = "0.18.1"
minijinja = { version = "2", features = ["loader"] }
percent-encoding = "2"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
walkdir = "2"
# default 会拖进整个 image crate（只为 DynamicImage 互转），这里用不到
webp = { version = "0.3", default-features = false }

[profile.release]
strip = true
